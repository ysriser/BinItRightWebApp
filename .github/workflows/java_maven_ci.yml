name: BinItRight Private Quality Pipeline (BYPASS MODE)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # PHASE 1: Unit Test (Bypass test failures)
      - name: Run Unit Tests
        # -Dmaven.test.failure.ignore=true allows the build to continue even if tests fail
        run: mvn -B test -Dmaven.test.failure.ignore=true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: target/surefire-reports/

      # PHASE 2: SCA (Trivy) (Bypass security failures)
      - name: Run Trivy SCA Scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          format: 'table'
          output: 'trivy-report.txt'
          # CHANGE: set exit-code to '0' to prevent the scan from stopping the pipeline
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt

      # PHASE 3: SAST (SonarCloud)
      - name: Run SonarCloud SAST
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify sonar:sonar \
          -Dsonar.projectKey=yuesheng \
          -Dsonar.organization=yuesheng \
          -Dsonar.host.url=https://sonarcloud.io \
          -DskipTests \
          -Dsonar.qualitygate.wait=false # Ensures build doesn't fail on Sonar Quality Gate

      # PHASE 4: Final Build Artifact
      - name: Final Package
        # This will now always run because previous steps "passed"
        run: mvn -B package -DskipTests

      - name: Upload Final Build (JAR)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binitright-app-binaries
          path: target/*.jar