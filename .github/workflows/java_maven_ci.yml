name: BinItRight Quality Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
  security-events: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for deep SAST analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 1. UNIT TEST: Fast feedback first
      - name: Run Unit Tests
        run: mvn -B test

      # 2. SCA: Check library safety
      - name: Update Dependency Graph
        uses: advanced-security/maven-dependency-submission-action@v4

      # 3. SAST: Deep scan of YOUR code
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # 4. BUILD: Final step only if all gates pass
      - name: Final Build
        run: mvn -B package -DskipTests