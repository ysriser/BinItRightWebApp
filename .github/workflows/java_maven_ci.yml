name: BinItRight Java Spring CICD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # BOX 1: LINT & UNIT TESTS
  # ==========================================
  lint-and-unit:
    name: Lint & Unit Tests
    # MODIFICATION: Only run this during the PR phase
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Unit Tests
        run: mvn -B test
      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-unit-reports
          path: target/surefire-reports/

  # ==========================================
  # BOX 2: SCA (Dependency Security)
  # ==========================================
  sca-scan:
    name: SCA (Trivy)
    # MODIFICATION: Only run this during the PR phase
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "table"
          output: "sca-report.txt"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
      - name: Upload SCA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-sca-results
          path: sca-report.txt

  # ==========================================
  # BOX 3: SAST (Code Security)
  # ==========================================
  sast-scan:
    name: SAST (Semgrep)
    # MODIFICATION: Only run this during the PR phase
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep Scan
        run: semgrep scan --config auto --json --output semgrep-results.json
      - name: Upload SAST Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-sast-results
          path: semgrep-results.json

  # ==========================================
  # BOX 4: MAVEN BUILD (Creates JAR)
  # ==========================================
  maven-build:
    name: Maven Build
    # MODIFICATION: This now runs on PRs (to verify the build) OR on Master (to prepare the image)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    # MODIFICATION: We make the 'needs' optional so it can jump ahead on Master
    needs: []
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Package JAR
        run: mvn -B package -DskipTests
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-binary
          path: target/*.jar
          retention-days: 1

  # ==========================================
  # BOX 5: DOCKERIZATION
  # ==========================================
  docker-push:
    name: Docker Build & Push
    # MODIFICATION: We only build the actual container when merging to master
    if: github.ref == 'refs/heads/master'
    needs: maven-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-binary
          path: target/
      - name: Login to DigitalOcean
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: _
          password: ${{ secrets.DO_ACCESS_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}
            registry.digitalocean.com/binitright/binitright-app:master

  # ==========================================
  # BOX 6: DEPLOY TO TEST
  # ==========================================
  deploy-test:
    name: Deploy to Test Server
    if: github.ref == 'refs/heads/master'
    needs: docker-push
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: SSH Deploy to Test
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export JAVA_IMAGE=registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}
            docker login -u _ -p ${{ secrets.DO_ACCESS_TOKEN }} registry.digitalocean.com
            cd /path/to/your/project
            docker compose pull java-app
            docker compose up -d --no-deps java-app
            docker image prune -f
            sleep 30

  # ==========================================
  # BOX 7a: INTEGRATION TESTS (Gate 1)
  # ==========================================
  integration-tests:
    name: Integration Tests
    if: github.ref == 'refs/heads/master'
    needs: deploy-test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: binitright # Added this to simplify DB creation
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Integration Tests
        run: mvn verify -DskipUnitTests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/binitright
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root

  # ==========================================
  # BOX 7b: DAST SECURITY SCAN (Gate 2)
  # ==========================================
  dast-scan:
    name: DAST Security Scan
    if: github.ref == 'refs/heads/master'
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Wait for App to be Responsive
        # This prevents ZAP from starting before the server is actually listening
        run: |
          timeout 300s bash -c 'until curl -sSf http://${{ secrets.TEST_IP }}:8080 > /dev/null; do echo "Waiting for app..."; sleep 5; done'

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          # Ensure you include the port (e.g., :8080) if not using standard port 80
          target: "http://${{ secrets.TEST_IP }}:8080"
          fail_action: true