name: BinItRight Ultimate DO Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # BOX 1: UNIT TESTING
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Unit Tests
        run: mvn -B test -Dmaven.test.failure.ignore=true

  # BOX 2: SCA (LIBRARIES)
  sca-scan:
    needs: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '0'

  # BOX 3: SAST (CODE QUALITY)
  sast-scan:
    needs: sca-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify sonar:sonar \
          -Dsonar.projectKey=BinItRight \
          -Dsonar.organization=binitright \
          -Dsonar.host.url=https://sonarcloud.io \
          -DskipTests \
          -Dsonar.qualitygate.wait=false

  # BOX 4: THE BINARY BUILD
  build:
    needs: sast-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Final Package
        run: mvn -B package -DskipTests
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: binitright-app-binaries
          path: target/*.jar

  # BOX 5: DOCKER PACKAGING (Conditional for PR/Master)
  docker-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: binitright-app-binaries
          path: target/

      # STABLE LOGIN: Using underscore (_) is the DO standard for PAT auth
      - name: Login to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: _
          password: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Build and Push
        run: |
          # The registry name is 'binitright'
          REG=registry.digitalocean.com/binitright/binitright-app
          docker build -t $REG:latest .
          docker tag $REG:latest $REG:${{ github.sha }}
          docker push $REG:latest
          docker push $REG:${{ github.sha }}