name: BinItRight Java Spring CICD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # BOX 1: LINT & UNIT TESTS
  # ==========================================
  lint-and-unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Unit Tests
        run: mvn -B test
      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-unit-reports
          path: target/surefire-reports/

  # ==========================================
  # BOX 2: SCA (Dependency Security)
  # ==========================================
  sca-scan:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "table"
          output: "sca-report.txt"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
      - name: Upload SCA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-sca-results
          path: sca-report.txt

  # ==========================================
  # BOX 3: SAST (Code Security)
  # ==========================================
  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep Scan
        # We run the command exactly as it's meant to be run in the CLI
        run: semgrep scan --config auto --json --output semgrep-results.json

      - name: Upload SAST Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-sast-results
          path: semgrep-results.json

  # ==========================================
  # BOX 4: MAVEN BUILD (Creates JAR)
  # ==========================================
  maven-build:
    name: Maven Build
    needs: [lint-and-unit, sca-scan, sast-scan] # Waits for security & logic to pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Package JAR
        run: mvn -B package -DskipTests
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-binary
          path: target/*.jar
          retention-days: 1

  # ==========================================
  # BOX 5: DOCKERIZATION
  # ==========================================
  docker-push:
    name: Docker Build & Push
    needs: maven-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-binary
          path: target/
      - name: Login to DigitalOcean
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: _
          password: ${{ secrets.DO_ACCESS_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.digitalocean.com/binitright/app:${{ github.sha }}
            registry.digitalocean.com/binitright/app:${{ github.head_ref || github.ref_name }}

  # ==========================================
  # BOX 6: DEPLOY TO TEST
  # ==========================================
  deploy-test:
    name: Deploy to Test Server
    if: github.ref == 'refs/heads/master'
    needs: docker-push
    runs-on: ubuntu-latest
    # We still use the environment name for tracking,
    # even if the secrets are global.
    environment: test
    steps:
      - name: SSH Deploy to Test
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export JAVA_IMAGE=registry.digitalocean.com/binitright/app:${{ github.sha }}
            docker login -u _ -p ${{ secrets.DO_ACCESS_TOKEN }} registry.digitalocean.com
            
            # Navigate to your specific project folder
            cd /path/to/your/project
            
            # Pull only the new Java image
            docker compose pull java-app
            
            # Update only the Java app (Python app remains untouched)
            docker compose up -d --no-deps java-app
            
            # Cleanup old versions
            docker image prune -f
            
            # Allow Spring Boot 30s to start up
            sleep 30

  # ==========================================
  # BOX 7a: INTEGRATION TESTS (Gate 1)
  # ==========================================
  integration-tests:
    name: Integration Tests
    needs: deploy-test # Starts after Test deploy
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" 
          --health-retries=10 
          --execute="CREATE DATABASE IF NOT EXISTS binitright;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - name: Run Integration Tests
        run: mvn verify -DskipUnitTests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/binitright
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root

  # ==========================================
  # BOX 7b: DAST SECURITY SCAN (Gate 2)
  # ==========================================
  dast-scan:
    name: DAST Security Scan
    needs: integration-tests # MUST WAIT FOR INTEGRATION
    runs-on: ubuntu-latest
    steps:
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://${{ secrets.TEST_IP }}"
          fail_action: true