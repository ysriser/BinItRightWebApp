name: BinItRight Quality Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
  security-events: write
  actions: read           # Fixes the telemetry status report error

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # PHASE 1: Unit Testing
      - name: Run Unit Tests
        run: mvn -B test

      # PHASE 2: SCA (Dependency Scanning)
      - name: SCA - Dependency Submission
        uses: advanced-security/maven-dependency-submission-action@v4

      # PHASE 3: SAST (CodeQL Analysis)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      # 'clean compile' ensures CodeQL extracts all source code correctly
      - name: Build for SAST Analysis
        run: mvn -B clean compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # PHASE 4: Final Build
      - name: Final Package
        run: mvn -B package -DskipTests