name: BinItRight Private Quality Pipeline (Multi-Job)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # JOB 1: UNIT TESTING
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run Unit Tests
        run: mvn -B test -Dmaven.test.failure.ignore=true
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: target/surefire-reports/

  # JOB 2: SCA (TRIVY)
  sca-scan:
    needs: unit-test # This creates the link between boxes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy SCA Scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          format: 'table'
          output: 'trivy-report.txt'
          exit-code: '0' # Keeps bypass mode active
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt

  # JOB 3: SAST (SONARCLOUD)
  sast-scan:
    needs: sca-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run SonarCloud SAST
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify sonar:sonar \
          -Dsonar.projectKey=BinItRight \
          -Dsonar.organization=binitright \
          -Dsonar.host.url=https://sonarcloud.io \
          -DskipTests \
          -Dsonar.qualitygate.wait=false

  # JOB 4: BUILD & PACKAGE
  build:
    needs: sast-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Final Package
        run: mvn -B package -DskipTests
      - name: Upload Final Build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binitright-app-binaries
          path: target/*.jar