steps:
  - uses: actions/checkout@v4

  - name: Set up JDK 21
    uses: actions/setup-java@v4
    with:
      java-version: '21'
      distribution: 'temurin'
      cache: maven

  # 1. UNIT TEST (Safe to keep here if you want fast feedback)
  - name: Run Unit Tests
    run: mvn -B test

  # 2. SCA
  - name: Update Dependency Graph
    uses: advanced-security/maven-dependency-submission-action@v4

  # 3. SAST (CODEQL START)
  - name: Initialize CodeQL
    uses: github/codeql-action/init@v3
    with:
      languages: java-kotlin

  # CRITICAL STEP: CodeQL needs to "see" a clean build to extract the code
  - name: Build for CodeQL
    run: mvn -B clean compile -DskipTests

  - name: Perform CodeQL Analysis
    uses: github/codeql-action/analyze@v3

  # 4. FINAL BUILD (Optional, since 'compile' already happened)
  - name: Final Build
    run: mvn -B package -DskipTests