name: BinItRight Security Pipeline

on:
  push:
    branches: [ "master" ]  # Triggers on merge to master
  pull_request:
    branches: [ "master" ]  # Triggers on PR creation/update

permissions:
  contents: write
  security-events: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # PHASE 1: Unit Testing (JUnit 5)
      - name: Run Unit Tests
        run: mvn -B test

      # PHASE 2: SCA (Software Composition Analysis)
      # This uploads your dependency list to GitHub's security engine
      - name: SCA - Dependency Submission
        uses: advanced-security/maven-dependency-submission-action@v4

      # PHASE 3: SAST (Static Application Security Testing)
      # CodeQL scans YOUR custom Java code for security holes
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      # IMPORTANT: We run 'clean compile' here so CodeQL can "watch"
      # a fresh build. This prevents the "No source code seen" error.
      - name: Build for SAST Analysis
        run: mvn -B clean compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # PHASE 4: Final Build
      # Only reached if Tests, SCA, and SAST all pass
      - name: Final Package
        run: mvn -B package -DskipTests