name: BinItRight Private Quality Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # PHASE 1: Unit Test
      - name: Run Unit Tests
        run: mvn -B test

      # PHASE 2: SCA (Trivy)
      # FIX: Updated version to 0.33.1
      - name: Run Trivy SCA Scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # PHASE 3: SAST (SonarCloud)
      - name: Run SonarCloud SAST
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify sonar:sonar \
          -Dsonar.projectKey=your_project_key \
          -Dsonar.organization=your_org_name \
          -Dsonar.host.url=https://sonarcloud.io \
          -DskipTests

      # PHASE 4: Final Build
      - name: Final Package
        run: mvn -B package -DskipTests