name: PR Validation (Quality Gates)

on:
  pull_request:
    branches: [ "master" ]

jobs:

  # ==========================================
  # BOX 1a: LINT (Static Analysis)
  # ==========================================
  lint:
    name: Java Linting (PMD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run PMD Analysis
        continue-on-error: true
        run: mvn pmd:pmd pmd:cpd

      - name: Upload PMD Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-lint-reports
          path: target/**/*.xml
          if-no-files-found: warn

  # ==========================================
  # BOX 1b: UNIT TESTS
  # ==========================================
  unit-tests:
    name: Java Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn -B test

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-unit-reports
          path: target/surefire-reports/

  # ==========================================
  # BOX 1c: CODE COVERAGE (JaCoCo)
  # ==========================================
  coverage:
    name: Code Coverage Report
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Tests with Coverage
        run: mvn clean test jacoco:report
      
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: java-coverage-reports
          path: |
            target/site/jacoco/
            target/site/jacoco/jacoco.xml
          retention-days: 7

  # ==========================================
  # BOX 2: SCA (Dependency Security)
  # ==========================================
  sca-scan:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy SCA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "sarif" # CHANGED
          output: "java-sca.sarif" # CHANGED
          exit-code: "0"
          severity: "CRITICAL,HIGH"
      - name: Upload SCA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-sca-results
          path: java-sca.sarif

  # ==========================================
  # BOX 3: SAST (Code Security)
  # ==========================================
  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep Scan
        run: semgrep scan --config auto --sarif --output semgrep.sarif
      - name: Upload SAST Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-sast-results
          path: semgrep.sarif

  # ==========================================
  # BOX 4: MAVEN BUILD (Verification)
  # ==========================================
  maven-build:
    name: Maven Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Package JAR
        run: mvn -B package -DskipTests
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-binary-pr
          path: target/*.jar
          retention-days: 1

