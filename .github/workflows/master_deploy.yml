name: Master Deployment

on:
  push:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # BOX 4 & 5: BUILD & DOCKERIZATION
  # ==========================================
  docker-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package JAR
        run: mvn -B package -DskipTests

      - name: Login to DigitalOcean
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: _
          password: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}
            registry.digitalocean.com/binitright/binitright-app:master

  # ==========================================
  # BOX 6: DEPLOY TO TEST
  # ==========================================
  deploy-test:
    name: Deploy to Test
    needs: docker-push
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Sync Test Files (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TEST_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/root/binitright-test/"
          timeout: 120s  # MATCHED PROD: Gives the network/disk more time to breathe

      - name: SSH Deploy to Test
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Ensure the directory exists just in case SCP had a partial fail
            mkdir -p /root/binitright-test/
            cd /root/binitright-test/
            
            # Match your Prod Export Logic
            export MYSQL_ROOT_PASSWORD=${{ secrets.TEST_DB_PASSWORD }}
            export JAVA_IMAGE=registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}
            
            docker login -u _ -p ${{ secrets.DO_ACCESS_TOKEN }} registry.digitalocean.com
            
            # Using --pull always to match your prod command
            docker compose up -d --pull always --remove-orphans java-app
            
            docker image prune -f
            sleep 45

  # ==========================================
  # BOX 7b: DAST SECURITY SCAN
  # ==========================================
  dast-scan:
    name: DAST Security Scan
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - name: Wait for App to be Responsive
        run: |
          timeout 300s bash -c 'until curl -sSf http://${{ secrets.TEST_IP }}:8080 > /dev/null; do echo "Waiting for app..."; sleep 5; done'
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://${{ secrets.TEST_IP }}:8080"
          fail_action: true
      - name: Upload DAST Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-dast-results
          path: |
            report_html.html
            report_json.json

  # ==========================================
  # BOX 7c: TAG FOR PRODUCTION
  # ==========================================
  tag-production:
    name: Tag Production Image
    needs: dast-scan
    runs-on: ubuntu-latest
    steps:
      - name: Login to DigitalOcean
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: _
          password: ${{ secrets.DO_ACCESS_TOKEN }}
      - name: Pull, Tag, and Push
        run: |
          docker pull registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}
          docker tag registry.digitalocean.com/binitright/binitright-app:${{ github.sha }} \
                     registry.digitalocean.com/binitright/binitright-app:production
          docker push registry.digitalocean.com/binitright/binitright-app:production

  # ==========================================
  # BOX 8: PRODUCTION RELEASE (PAUSES FOR APPROVAL)
  # ==========================================
  deploy-production:
    name: Production Release
    needs: tag-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Sync Production Files (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "/root/binitright-prod/"
      - name: SSH Deploy Production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/binitright-prod/
            export MYSQL_ROOT_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
            export JAVA_IMAGE=registry.digitalocean.com/binitright/binitright-app:production
            docker login -u _ -p ${{ secrets.DO_ACCESS_TOKEN }} registry.digitalocean.com
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --pull always --remove-orphans java-app
            docker image prune -f