name: Master Deployment

on:
  push:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # BOX 4 & 5: BUILD & DOCKERIZATION
  # ==========================================
  docker-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package JAR
        run: mvn -B package -DskipTests

      - name: Login to DigitalOcean
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: _
          password: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}
            registry.digitalocean.com/binitright/binitright-app:master

  # ==========================================
  # BOX 6: DEPLOY TO TEST
  # ==========================================
  deploy-test:
    name: Deploy to Test
    needs: docker-push
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Sync Test Files (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TEST_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/root/binitright-test/"
          timeout: 150s  # MATCHED PROD: Gives the network/disk more time to breathe

      - name: SSH Deploy to Test
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            mkdir -p /root/binitright-test/
            cd /root/binitright-test/
            
            docker image prune -f
            docker image prune -a -f --filter "until=1h"
            
            # Define and Export all variables first
            export JAVA_IMAGE='registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}'
            export MYSQL_ROOT_PASSWORD='${{ secrets.TEST_DB_PASSWORD }}'
            export DATA_GOV_API_KEY='${{ secrets.DATA_GOV_API_KEY }}'
            export APP_ADMIN_PASSWORD='${{ secrets.APP_ADMIN_PASSWORD }}'
            export SPACES_ACCESS_KEY='${{ secrets.SPACES_ACCESS_KEY }}'
            export SPACES_SECRET_KEY='${{ secrets.SPACES_SECRET_KEY }}'
            export OPENAI_API_KEY_CHAT='${{ secrets.OPENAI_API_KEY_CHAT }}'
            export SPRING_PROFILES_ACTIVE=test
            export TIER2_PROVIDER='${{ secrets.TIER2_PROVIDER }}'
            export OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}'
            
            # Pull the image using the variable
            docker login -u _ -p ${{ secrets.DO_ACCESS_TOKEN }} registry.digitalocean.com
            docker pull "$JAVA_IMAGE"
            
            # Clean environment (nuke volumes to force re-seeding)
            docker compose down -v --remove-orphans
            
            # Start the stack
            docker compose up -d
            
            # Cleanup
            docker image prune -f
            docker image prune -a -f --filter "until=1h"

  # ==========================================
  # BOX 7a SELENIUM E2E TESTS
  # ==========================================
  selenium-e2e:
    name: Selenium E2E Test
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Wait for Seeders to Finish
        run: |
          echo "Waiting for app readiness and data seeding at http://${{ secrets.TEST_URL }}:443/api/ready..."
          # Increase timeout to 420s (7 mins) to give API calls time to finish
          timeout 420s bash -c 'until curl -sSf https://${{ secrets.TEST_URL }}/api/ready | grep "READY"; do 
            echo "Seeding data from APIs... please wait..."
            sleep 10
          done'

      # Run the actual tests (generates the JSON results)
      - name: Run Selenium Tests
        run: |
          mvn verify \
          -Dmaven.test.failure.ignore=true \
          -Dsurefire.skip=true \
          -Dtarget_host=${{ secrets.TEST_URL }} \
          -Dtarget_port=443 \
          -Dheadless=true

      # Convert JSONs into an HTML website
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      # Zip and upload the HTML folder so you can download it from GitHub
      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-ui-report
          path: target/site/allure-maven-plugin/
          retention-days: 7

  # ==========================================
  # BOX 7b: JMETER LOAD TEST (Stability Gate)
  # ==========================================
  load-test:
    name: JMeter Load Test
    needs: selenium-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Create Tests Directory
        run: mkdir -p tests
        
      - name: Generate JMX Script
        continue-on-error: true #REMEMBER TO COMMENT OUT
        run: |
          mvn test-compile exec:java -Dexec.classpathScope=test \
            -Dexec.mainClass="tech3.binitright.performance.JmxGenerator" \
            -Dtarget_host=test \
            -Dtest_url="${{ secrets.TEST_URL }}" \
            -Dperf_app_user="${{ secrets.PERF_APP_USER }}" \
            -Dperf_app_pass="${{ secrets.PERF_APP_PASS }}" \
            -Dperf_user="${{ secrets.PERF_ADMIN_USER }}" \
            -Dperf_pass="${{ secrets.PERF_ADMIN_PASS }}"
            
      - name: Install & Run Apache JMeter
        continue-on-error: true #REMEMBER TO COMMENT OUT
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          # Running JMeter using the generated JMX
          ./apache-jmeter-5.6.3/bin/jmeter -n -t tests/load_test.jmx \
            -l results.jtl -e -o dashboard
            
      - name: Upload Performance Dashboard
        if: always()
        continue-on-error: true #REMEMBER TO COMMENT OUT
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-performance-report
          path: dashboard/

  # ==========================================
  # DAST SECURITY SCAN (FULL MONOLITH COVERAGE)
  # ==========================================
  dast-scan:
    name: DAST Security Scan
    needs: load-test
    runs-on: ubuntu-latest
    steps:
      - name: Wait for App to be Responsive
        run: |
          timeout 300s bash -c 'until curl -sSf "https://${{ secrets.TEST_URL }}:443" > /dev/null; do echo "Waiting..."; sleep 5; done'

      - name: Get Tokens and Verify OpenAPI
        id: setup
        run: |
          # 1. Capture user1 JWT
          JWT=$(curl -s -X POST "https://${{ secrets.TEST_URL }}:443/api/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"user1","password":"${{ secrets.APP_USER_PASSWORD }}"}' | jq -r '.token')
  
          # 2. Capture Admin JSESSIONID
          curl -s -c cookies.txt "https://${{ secrets.TEST_URL }}:443/login" > login.html
          CSRF=$(grep -oP '(?<=_csrf" value=")[^"]*' login.html)
          curl -s -b cookies.txt -c cookies.txt -X POST "https://${{ secrets.TEST_URL }}:443/login" \
            -d "username=admin&password=${{ secrets.APP_ADMIN_PASSWORD }}&_csrf=$CSRF"
          SESSION=$(grep "JSESSIONID" cookies.txt | awk '{print $7}')
  
          # 3. VERIFY OPENAPI (Map Check)
          # This confirms ZAP will be able to see the endpoints
          curl -sIf "https://${{ secrets.TEST_URL }}:443/v3/api-docs" || exit 1
  
          # 4. Create ZAP Auth Prop File
          cat <<EOF > zap_auth.prop
          replacer.full_list(0).description=user1_jwt
          replacer.full_list(0).enabled=true
          replacer.full_list(0).matchtype=REQ_HEADER
          replacer.full_list(0).matchstr=Authorization
          replacer.full_list(0).replacement=Bearer $JWT
          replacer.full_list(1).description=admin_session
          replacer.full_list(1).enabled=true
          replacer.full_list(1).matchtype=REQ_HEADER
          replacer.full_list(1).matchstr=Cookie
          replacer.full_list(1).replacement=JSESSIONID=$SESSION
          EOF

      # --- PART 1: UI SCAN (Baseline) ---
      - name: Run ZAP UI Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: "https://${{ secrets.TEST_URL }}:443"
          artifact_name: "zap-ui-report"
          cmd_options: '-z "-configfile /zap/wrk/zap_auth.prop" -j' # -j enables AJAX spider

      # --- PART 2: API SCAN (Deep Attack) ---
      - name: Run ZAP API Scan
        id: api_scan
        uses: zaproxy/action-api-scan@v0.12.0
        continue-on-error: true
        with:
          target: "https://${{ secrets.TEST_URL }}:443/v3/api-docs"
          format: openapi
          artifact_name: "zap-api-report"
          cmd_options: '-z "-configfile /zap/wrk/zap_auth.prop"'

      - name: Upload Combined Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-security-reports
          path: |
            report_html.html
            report_json.json

      - name: Create DAST Summary
        if: always()
        run: |
          echo "## 🛡️ DAST Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "View the **dast-security-reports** artifact for full details." >> $GITHUB_STEP_SUMMARY
          echo "- **UI Baseline Scan Outcome:** ${{ steps.zap_scan.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Deep Scan Outcome:** ${{ steps.api_scan.outcome }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # BOX 8: PRODUCTION RELEASE & VERSION TAGGING
  # ==========================================
  deploy-production:
    name: Production Release
    needs: dast-scan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: vars
        run: |
          # --- CONFIGURATION AREA ---
          # Update this BASE variable whenever you want to bump Major/Minor versions
          BASE="v1.0."
          # --------------------------

          git fetch --tags
          
          # Find the latest tag that starts with our current BASE
          LATEST_TAG=$(git tag -l "${BASE}*" | sort -V | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
              # If no tags exist for this base (e.g., first run or new major version)
              NEXT_NUM=1
          else
              # Extract the number after the base (e.g., v1.0.15 -> 15)
              VERSION_NUM=${LATEST_TAG#$BASE}
              NEXT_NUM=$((VERSION_NUM + 1))
          fi

          NEW_TAG="${BASE}${NEXT_NUM}"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Calculated Version: $NEW_TAG"

      - name: Login to DigitalOcean
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: _
          password: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Tag and Push Docker Image
        run: |
          docker pull registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}
          docker tag registry.digitalocean.com/binitright/binitright-app:${{ github.sha }} \
                     registry.digitalocean.com/binitright/binitright-app:${{ env.NEW_TAG }}
          docker push registry.digitalocean.com/binitright/binitright-app:${{ env.NEW_TAG }}

      - name: Sync Production Files (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "/root/binitright-prod/"
          timeout: 150s  # MATCHED PROD: Gives the network/disk more time to breathe

      - name: SSH Deploy Production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/binitright-prod/
            
            docker image prune -f
            docker image prune -a -f --filter "until=1h"
            
            # Define and Export
            export JAVA_IMAGE='registry.digitalocean.com/binitright/binitright-app:${{ env.NEW_TAG }}'
            export MYSQL_ROOT_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export DATA_GOV_API_KEY='${{ secrets.DATA_GOV_API_KEY }}'
            export APP_ADMIN_PASSWORD='${{ secrets.APP_ADMIN_PASSWORD }}'
            export SPACES_ACCESS_KEY='${{ secrets.SPACES_ACCESS_KEY }}'
            export SPACES_SECRET_KEY='${{ secrets.SPACES_SECRET_KEY }}'
            export OPENAI_API_KEY_CHAT='${{ secrets.OPENAI_API_KEY_CHAT }}'
            export SPRING_PROFILES_ACTIVE=prod
            export TIER2_PROVIDER='${{ secrets.TIER2_PROVIDER }}'
            export OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}'
            
            # Login and Pull
            docker login -u _ -p ${{ secrets.DO_ACCESS_TOKEN }} registry.digitalocean.com
            docker pull "$JAVA_IMAGE"
            
            # Clean orphans on 8080
            docker rm -f $(docker ps -q --filter "publish=8080") || true
            
            # Deploy (Keep volumes for Prod)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            
            # 5. Cleanup
            docker image prune -f
            docker image prune -a -f --filter "until=1h"

      - name: Push Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ env.NEW_TAG }}
          git push origin ${{ env.NEW_TAG }}
