name: Master Deployment (The Gauntlet)

on:
  push:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # BOX 4 & 5: BUILD & DOCKERIZATION
  # ==========================================
  docker-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package JAR
        run: mvn -B package -DskipTests

      - name: Login to DigitalOcean
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: _
          password: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}
            registry.digitalocean.com/binitright/binitright-app:master

  # ==========================================
  # BOX 6: DEPLOY TO TEST
  # ==========================================
  deploy-test:
    name: Deploy to Test
    needs: docker-push
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Sync Files (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TEST_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/root/binitright-test/"
      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/binitright-test/
            export MYSQL_ROOT_PASSWORD=${{ secrets.TEST_DB_PASSWORD }}
            export JAVA_IMAGE=registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}
            docker login -u _ -p ${{ secrets.DO_ACCESS_TOKEN }} registry.digitalocean.com
            docker compose up -d --pull always --remove-orphans java-app
            sleep 45

  # ==========================================
  # BOX 7b: DAST SECURITY SCAN
  # ==========================================
  dast-scan:
    name: DAST Security Scan
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - name: Wait for App to be Responsive
        run: |
          timeout 300s bash -c 'until curl -sSf http://${{ secrets.TEST_IP }}:8080 > /dev/null; do echo "Waiting for app..."; sleep 5; done'
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://${{ secrets.TEST_IP }}:8080"
          fail_action: true
      - name: Upload DAST Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-dast-results
          path: |
            report_html.html
            report_json.json