name: Master Deployment (The Gauntlet)

on:
  push:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # BOX 4 & 5: BUILD & DOCKERIZATION
  # ==========================================
  docker-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package JAR
        run: mvn -B package -DskipTests

      - name: Login to DigitalOcean
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: _
          password: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}
            registry.digitalocean.com/binitright/binitright-app:master

  # ==========================================
  # BOX 6: DEPLOY TO TEST
  # ==========================================
  deploy-test:
    name: Deploy to Test Server
    needs: docker-push
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: SSH Deploy to Test
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export JAVA_IMAGE=registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}
            docker login -u _ -p ${{ secrets.DO_ACCESS_TOKEN }} registry.digitalocean.com
            cd /path/to/your/project
            docker compose pull java-app
            docker compose up -d --no-deps java-app
            docker image prune -f
            sleep 30

  # ==========================================
  # BOX 7a: INTEGRATION TESTS
  # ==========================================
  integration-tests:
    name: Integration Tests
    needs: deploy-test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: binitright
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Integration Tests
        run: mvn verify -DskipUnitTests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/binitright
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root

  # ==========================================
  # BOX 7b: DAST SECURITY SCAN
  # ==========================================
  dast-scan:
    name: DAST Security Scan
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Wait for App to be Responsive
        run: |
          timeout 300s bash -c 'until curl -sSf http://${{ secrets.TEST_IP }}:8080 > /dev/null; do echo "Waiting for app..."; sleep 5; done'

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://${{ secrets.TEST_IP }}:8080"
          fail_action: true