name: Master Deployment

on:
  push:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # BOX 4 & 5: BUILD & DOCKERIZATION
  # ==========================================
  docker-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package JAR
        run: mvn -B package -DskipTests

      - name: Login to DigitalOcean
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: _
          password: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}
            registry.digitalocean.com/binitright/binitright-app:master

  # ==========================================
  # BOX 6: DEPLOY TO TEST
  # ==========================================
  deploy-test:
    name: Deploy to Test
    needs: docker-push
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Sync Test Files (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TEST_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/root/binitright-test/"
          timeout: 150s  # MATCHED PROD: Gives the network/disk more time to breathe

      - name: SSH Deploy to Test
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            mkdir -p /root/binitright-test/
            cd /root/binitright-test/
            
            IMG='registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}'
            PASS='${{ secrets.TEST_DB_PASSWORD }}'
            
            docker login -u _ -p ${{ secrets.DO_ACCESS_TOKEN }} registry.digitalocean.com
            docker pull "$IMG"
            
            # In the deploy-test SSH script
            JAVA_IMAGE="$IMG" MYSQL_ROOT_PASSWORD="$PASS" \
            docker compose down -v --remove-orphans # The -v nukes the volume
            
            API_KEY='${{ secrets.DATA_GOV_API_KEY }}'
            ADMIN_VAL='${{ secrets.APP_ADMIN_PASSWORD }}'
            
            DATA_GOV_API_KEY="$API_KEY" \
            APP_ADMIN_PASSWORD="$ADMIN_VAL" \
            JAVA_IMAGE="$IMG" MYSQL_ROOT_PASSWORD="$PASS" SPRING_PROFILES_ACTIVE=test \
            docker compose up -d
            
            docker image prune -f

  # ==========================================
  # BOX 7a SELENIUM E2E TESTS
  # ==========================================
  selenium-e2e:
    name: Selenium E2E Test
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Wait for App to be Ready
        run: |
          echo "Waiting for app at http://${{ secrets.TEST_IP }}:8080/login..."
          timeout 180s bash -c 'until curl -sSf http://${{ secrets.TEST_IP }}:8080/login > /dev/null; do echo "Tomcat still booting..."; sleep 5; done'

      # Run the actual tests (generates the JSON results)
      - name: Run Selenium Tests
        run: |
          mvn verify \
          -Dmaven.test.failure.ignore=true \
          -Dsurefire.skip=true \
          -Dtarget_host=${{ secrets.TEST_IP }} \
          -Dtarget_port=8080 \
          -Dheadless=true

      # Convert JSONs into an HTML website
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      # Zip and upload the HTML folder so you can download it from GitHub
      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-ui-report
          path: target/site/allure-maven-plugin/
          retention-days: 7

  # ==========================================
  # BOX 7b: JMETER LOAD TEST (Stability Gate)
  # ==========================================
  load-test:
    name: JMeter Load Test
    needs: selenium-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create Tests Directory
        run: mkdir -p tests

      - name: Generate JMX Script
        # Passing port 8080 to match your TEST_IP environment
        run: mvn test-compile exec:java -Dexec.classpathScope="test" -Dexec.mainClass="tech3.binitright.performance.JmxGenerator" -Dtarget_port=8080

      - name: Install & Run Apache JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          ./apache-jmeter-5.6.3/bin/jmeter -n -t tests/load_test.jmx \
           -l results.jtl -e -o dashboard \
           -Jtarget_host=${{ secrets.TEST_IP }}

      - name: Upload Performance Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-performance-report
          path: dashboard/

  # ==========================================
  # BOX 7c: DAST SECURITY SCAN
  # ==========================================
  dast-scan:
    name: DAST Security Scan
    needs: load-test
    runs-on: ubuntu-latest
    steps:
      - name: Wait for App to be Responsive
        run: |
          timeout 300s bash -c 'until curl -sSf http://${{ secrets.TEST_IP }}:8080 > /dev/null; do echo "Waiting for app..."; sleep 5; done'
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://${{ secrets.TEST_IP }}:8080"
          cmd_options: '-I'
          fail_action: true
          allow_issue_writing: false
      - name: Upload DAST Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-dast-results
          path: |
            report_html.html
            report_json.json

  # ==========================================
  # BOX 8: PRODUCTION RELEASE & VERSION TAGGING
  # ==========================================
  deploy-production:
    name: Production Release
    needs: dast-scan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version
        id: vars
        run: |
          # --- CONFIGURATION AREA ---
          # Update this BASE variable whenever you want to bump Major/Minor versions
          BASE="v1.0."
          # --------------------------

          git fetch --tags
          
          # Find the latest tag that starts with our current BASE
          LATEST_TAG=$(git tag -l "${BASE}*" | sort -V | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
              # If no tags exist for this base (e.g., first run or new major version)
              NEXT_NUM=1
          else
              # Extract the number after the base (e.g., v1.0.15 -> 15)
              VERSION_NUM=${LATEST_TAG#$BASE}
              NEXT_NUM=$((VERSION_NUM + 1))
          fi

          NEW_TAG="${BASE}${NEXT_NUM}"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Calculated Version: $NEW_TAG"

      - name: Login to DigitalOcean
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: _
          password: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Tag and Push Docker Image
        run: |
          docker pull registry.digitalocean.com/binitright/binitright-app:${{ github.sha }}
          docker tag registry.digitalocean.com/binitright/binitright-app:${{ github.sha }} \
                     registry.digitalocean.com/binitright/binitright-app:${{ env.NEW_TAG }}
          docker push registry.digitalocean.com/binitright/binitright-app:${{ env.NEW_TAG }}

      - name: Sync Production Files (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROD_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "/root/binitright-prod/"
          timeout: 150s  # MATCHED PROD: Gives the network/disk more time to breathe

      - name: SSH Deploy Production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/binitright-prod/
            
            # Local variables for the script
            IMG='registry.digitalocean.com/binitright/binitright-app:${{ env.NEW_TAG }}'
            PASS='${{ secrets.DB_PASSWORD }}'  # FIXED NAME
            
            docker login -u _ -p ${{ secrets.DO_ACCESS_TOKEN }} registry.digitalocean.com
            docker pull "$IMG"
            
            # Safety cleanup of any orphaned containers on 8080
            docker rm -f $(docker ps -q --filter "publish=8080") || true
            
            JAVA_IMAGE="$IMG" MYSQL_ROOT_PASSWORD="$PASS" \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down # NO -v here!
            
            API_KEY='${{ secrets.DATA_GOV_API_KEY }}'
            ADMIN_VAL='${{ secrets.APP_ADMIN_PASSWORD }}'
            
            DATA_GOV_API_KEY="$API_KEY" \
            APP_ADMIN_PASSWORD="$ADMIN_VAL" \
            JAVA_IMAGE="$IMG" MYSQL_ROOT_PASSWORD="$PASS" SPRING_PROFILES_ACTIVE=prod \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            
            docker image prune -f

      - name: Push Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ env.NEW_TAG }}
          git push origin ${{ env.NEW_TAG }}
