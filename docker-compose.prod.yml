version: '3.8'
services:
  db:
    restart: always
    environment:
      MYSQL_DATABASE: binitright
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s
    volumes:
      - mysql_data:/var/lib/mysql

  java-app:
    image: ${JAVA_IMAGE}
    restart: always
    # This ensures that if the DB restarts, the app waits for it to be 'healthy'
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: