version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: always
    # FIX: Remove read_only: true for the DB.
    # Use volumes to persist your data instead of losing it on every restart.
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} # Match the variable in your SSH script
      MYSQL_DATABASE: binitright
    # Port 3306 is now restricted to the Droplet's localhost for security
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 90s

  java-app:
    image: ${JAVA_IMAGE}
    # Keep your strict security for the App - it works well here!
    restart: always
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"
    environment:
      DATA_GOV_API_KEY: ${DATA_GOV_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/binitright?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      SPACES_ACCESS_KEY: ${SPACES_ACCESS_KEY}
      SPACES_SECRET_KEY: ${SPACES_SECRET_KEY}
      PYTHON_SERVICE_BASE_URL: http://host.docker.internal:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: # This keeps your database from being wiped on every deploy