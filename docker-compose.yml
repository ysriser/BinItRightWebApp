version: '3.8'
services:
  db:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: binitright_db
    # FIX: Prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    # FIX: Prevent modification of system files
    read_only: true
    # Required: MySQL needs writable access to these specific locations to run
    tmpfs:
      - /tmp
      - /var/run/mysqld
      - /var/lib/mysql-files
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  java-app:
    image: ${JAVA_IMAGE}
    ports:
      - "${JAVA_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/binitright_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DB_ACTION}
    # FIX: Prevent privilege escalation
    security_opt:
      - no-new-privileges:true
    # FIX: Prevent modification of system files
    read_only: true
    # Required: Java/Tomcat needs to write temporary work files/logs
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy