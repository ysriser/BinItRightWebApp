spring.application.name=BinItRight
spring.jpa.show-sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/binitright?useSSL=false&serverTimezone=Asia/Singapore
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.generate-ddl=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=update


# Multipart upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

server.address = 0.0.0.0
server.port = 8080
data.gov.api.key=${DATA_GOV_API_KEY}
# Optional (your custom upload dir)
app.upload.dir=uploads
# Python ML Service Configuration
python.service.url=http://localhost:8000/forecast

# DigitalOcean Spaces Configuration
storage.spaces.enabled=true
storage.spaces.endpoint=https://sgp1.digitaloceanspaces.com
storage.spaces.region=sgp1
storage.spaces.bucket=binitrightstorage

storage.spaces.access-key=${SPACES_ACCESS_KEY}
storage.spaces.secret-key=${SPACES_SECRET_KEY}

python.service.base-url=http://localhost:8000