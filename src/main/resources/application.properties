spring.application.name=BinItRight
spring.jpa.show-sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/binitright?useSSL=false&serverTimezone=Asia/Singapore
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.generate-ddl=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=update

# Forces Spring to run data.sql even on non-embedded databases
spring.sql.init.mode=always

# Ensures Hibernate finishes building tables BEFORE data.sql runs
spring.jpa.defer-datasource-initialization=true

# Multipart upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

server.address = 0.0.0.0
server.port = 8080
data.gov.api.key=${DATA_GOV_API_KEY}
# Optional (your custom upload dir)
app.upload.dir=uploads
# Python ML Service Configuration
python.service.base-url=http://localhost:8000