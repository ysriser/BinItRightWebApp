spring.application.name=BinItRight
spring.jpa.show-sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/binitright?useSSL=false&serverTimezone=Asia/Singapore
spring.datasource.username=root
spring.datasource.password= ${MYSQL_ROOT_PASSWORD}
spring.jpa.generate-ddl=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Multipart upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

server.address = 0.0.0.0
server.port = 8080
# Python ML Service Configuration
python.service.url=http://localhost:8000/forecast

# DigitalOcean Spaces Configuration
storage.spaces.enabled=true
storage.spaces.endpoint=https://sgp1.digitaloceanspaces.com
storage.spaces.region=sgp1
storage.spaces.bucket=binitrightstorage

python.service.base-url=http://localhost:8000

openai.api.key=${OPENAI_API_KEY_CHAT}
openai.model=gpt-4o-mini
openai.base-url=https://api.openai.com/v1

server.forward-headers-strategy=native
# Scan v0.1 (Tier1 + Tier2)
scan.threshold.conf=${SCAN_CONF_THRESHOLD:0.70}
scan.threshold.margin=${SCAN_MARGIN_THRESHOLD:0.05}
scan.threshold.conf.plastic=${SCAN_CONF_THRESHOLD_PLASTIC:0.80}
scan.threshold.conf.glass=${SCAN_CONF_THRESHOLD_GLASS:0.80}

scan.tier2.provider=${TIER2_PROVIDER:mock}
scan.tier2.openai.url=${OPENAI_API_URL:https://api.openai.com/v1/responses}
scan.tier2.openai.model=${OPENAI_TIER2_MODEL:gpt-4o-mini}
scan.tier2.openai.timeout-ms=${OPENAI_TIMEOUT_MS:5000}
scan.tier2.openai.max-retries=${OPENAI_MAX_RETRIES:0}
scan.tier2.openai.reasoning-effort=${OPENAI_REASONING_EFFORT:minimal}
scan.tier2.openai.verbosity=${OPENAI_VERBOSITY:low}

